version: '3.8'

name: game-recommender
services:
  redis:
    container_name: redis
    image: redis:7-alpine
    expose:
      - "6379"
    networks: [ playcure ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  db-migrate:
    container_name: db-migrate
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
      target: build
      platforms:
        - linux/amd64
    depends_on:
      game_recommender_ai_db:
        condition: service_healthy
    working_dir: /app/services/backend
    entrypoint: [ "mvn" ]
    command: >
      -B liquibase:update
      -Dliquibase.url=jdbc:postgresql://game_recommender_ai_db:5432/${POSTGRES_DB}
      -Dliquibase.username=${POSTGRES_USER}
      -Dliquibase.password=${POSTGRES_PASSWORD}
    networks: [ playcure ]

  backend:
    container_name: backend
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
      platforms:
        - linux/amd64
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      game_recommender_ai_db:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_started
    # All application settings are read from infra/.env.
    env_file:
      - .env
    expose:
      - "8080"
    networks: [ playcure ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai-service:
    container_name: ai-service
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    # All application settings are read from infra/.env.
    env_file:
      - .env
    expose:
      - "8000"  # FastAPI health/metrics
      - "9090"  # gRPC
    networks: [ playcure ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  game_recommender_ai_db:
    container_name: game-recommender-postgres-db
    image: postgres:17.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    networks: [ playcure ]
    volumes:
      - game_recommender_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # proxy awareness
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    expose:
      - "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [ playcure ]
    depends_on:
      game_recommender_ai_db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    container_name: GR_prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
    networks: [ playcure ]

  grafana:
    image: grafana/grafana
    container_name: GR_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
    networks: [ playcure ]
    depends_on:
      - prometheus

networks:
  playcure:
    driver: bridge

volumes:
  game_recommender_ai_data:
  pgadmin_data:
  grafana-data:
  # Optional: persist data if needed
  # backend-data:
  # ai-service-data:
